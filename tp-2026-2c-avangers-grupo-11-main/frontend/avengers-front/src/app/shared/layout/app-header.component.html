<header class="brand-panel">
  <a routerLink="/" class="brand-link" aria-label="Avengers: Multiversal War">
    <span class="brand-mark" aria-hidden="true">⚡</span>
    <span>
      <strong>AVENGERS</strong>
      <small>MULTIVERSAL WAR</small>
    </span>
  </a>
  <div class="context-identity" *ngIf="context.context$ | async as current">
    <span>{{ current.profile.name }}</span>
    <small>{{ current.currentJourney?.status || i18n.t('noJourney') }}</small>
  </div>
</header>
